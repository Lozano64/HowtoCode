<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playground — Multi-File & Folder Studio</title>
  <!-- Matching Google Fonts from your theme -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       YOUR EXACT DESIGN SYSTEM TOKENS & BASE STYLES
       ============================================================ */
    :root {
      --bg: #f5f2fb;
      --panel: #fff;
      --line: #e2dbf2;
      --ink: #1f1b2e;
      --soft: #625b78;
      --accent: #8a63e8;
      --at: #efe9ff;
      --peach: #f2a272;
      --pt: #fff1e8;
      --pd: #b5622f;
      --ok: #1f9d63;
      --bad: #d6414f;
      --code: #17141f;
      --cl: #2c2640;
      --ct: #e8e3fa;
      --bar: #232230;
      --sh: 0 1px 2px rgba(40, 20, 90, .06), 0 12px 32px rgba(40, 20, 90, .08);
      --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
      --sans: "Figtree", "Segoe UI", system-ui, sans-serif;
      --mono: "JetBrains Mono", Consolas, Menlo, monospace;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #13101c;
        --panel: #1c1829;
        --line: #342c4c;
        --ink: #efeaff;
        --soft: #a69fc0;
        --accent: #a98bff;
        --at: #2a2145;
        --pt: #33241f;
        --pd: #ffb88f;
        --ok: #4fd699;
        --bad: #ff7b86;
        --code: #0f0c17;
        --sh: 0 12px 32px rgba(0, 0, 0, .4);
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #13101c;
      --panel: #1c1829;
      --line: #342c4c;
      --ink: #efeaff;
      --soft: #a69fc0;
      --accent: #a98bff;
      --at: #2a2145;
      --pt: #33241f;
      --pd: #ffb88f;
      --ok: #4fd699;
      --bad: #ff7b86;
      --code: #0f0c17;
      --sh: 0 12px 32px rgba(0, 0, 0, .4);
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background:
        radial-gradient(900px 420px at 88% -4%, rgba(138, 99, 232, .18), transparent 70%),
        radial-gradient(700px 420px at -4% 14%, rgba(242, 162, 114, .16), transparent 70%),
        var(--bg);
      background-attachment: fixed;
      color: var(--ink);
      font: 400 16px/1.6 var(--sans);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    :focus-visible {
      outline: 3px solid var(--peach);
      outline-offset: 2px;
    }

    /* ============================================================
       MATCHING HEADER (.nb)
       ============================================================ */
    header {
      padding: 10px 14px;
      flex: none;
    }

    .nb {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 12px 0 10px;
      border-radius: 20px;
      background: linear-gradient(120deg, rgba(30, 27, 46, .93), rgba(56, 40, 96, .93));
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      backdrop-filter: blur(18px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, .14);
      box-shadow: 0 14px 34px rgba(40, 20, 90, .3), inset 0 1px 0 rgba(255, 255, 255, .12);
    }

    .l, .r {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      color: #fff;
    }

    .lb {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--peach));
      font: 700 14px var(--mono);
      box-shadow: 0 4px 14px rgba(242, 162, 114, .4);
      transform: rotate(-6deg);
      transition: transform .25s;
    }

    .logo:hover .lb {
      transform: rotate(4deg) scale(1.06);
    }

    .wm {
      font: 800 20px var(--display);
      letter-spacing: -.03em;
    }

    .wm i {
      font-style: normal;
      color: var(--peach);
    }

    .ib {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: 0;
      background: rgba(255, 255, 255, .09);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 16px;
      transition: background .2s, transform .15s;
    }

    .ib:hover {
      background: rgba(255, 255, 255, .18);
    }

    .ib:active {
      transform: scale(.92);
    }

    /* ============================================================
       PLAYGROUND SHELL (.play & .mt)
       ============================================================ */
    .play {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      background: var(--bar);
      margin: 0 14px 14px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--cl);
      box-shadow: var(--sh);
    }

    /* Top Studio Action Bar (.mt) */
    .mt {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      background: #1d1a29;
      border-bottom: 1px solid var(--cl);
      color: #fff;
      flex-wrap: wrap;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 6px 13px;
      font: 600 13px var(--sans);
      background: var(--peach);
      color: #2a1608;
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
      text-decoration: none;
      transition: filter .15s, transform .12s;
    }

    .btn:hover:not(:disabled) {
      filter: brightness(1.07);
    }

    .btn:active:not(:disabled) {
      transform: scale(.97);
    }

    .btn.g {
      background: rgba(255, 255, 255, .09);
      color: #e8e3fa;
      border: 1px solid rgba(255, 255, 255, .08);
    }

    .btn.g:hover:not(:disabled) {
      background: rgba(255, 255, 255, .16);
      filter: none;
    }

    .btn.ac {
      background: linear-gradient(135deg, var(--accent), #a682ff);
      color: #fff;
    }

    .btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .sv {
      font: 12px var(--mono);
      color: #a9dc76;
      opacity: 0;
      transition: opacity .25s;
    }

    .sv.v {
      opacity: 1;
    }

    /* ============================================================
       WORKSPACE COLUMNS: FOLDER SIDEBAR + EDITOR + PREVIEW
       ============================================================ */
    .ws {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* Folder Explorer Drawer */
    .fd {
      width: 225px;
      flex: none;
      background: #1a1726;
      border-right: 1px solid var(--cl);
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    .fd-h {
      padding: 10px 12px;
      font: 700 11px var(--mono);
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #9c95b8;
      border-bottom: 1px solid var(--cl);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .fd-h span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .fd-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .fi {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 9px;
      border-radius: 9px;
      font: 500 13px var(--sans);
      color: #c9c4de;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background .15s, color .15s;
    }

    .fi:hover {
      background: rgba(255, 255, 255, .07);
      color: #fff;
    }

    .fi.on {
      background: linear-gradient(135deg, rgba(138, 99, 232, .32), rgba(242, 162, 114, .18));
      border: 1px solid rgba(169, 139, 255, .35);
      color: #fff;
      font-weight: 600;
    }

    .ext-pill {
      font: 700 10px var(--mono);
      padding: 1px 5px;
      border-radius: 5px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .ext-html { background: rgba(242, 162, 114, .2); color: #f2a272; }
    .ext-css  { background: rgba(183, 156, 255, .2); color: #b79cff; }
    .ext-js   { background: rgba(169, 220, 118, .2); color: #a9dc76; }
    .ext-txt  { background: rgba(255, 255, 255, .12); color: #c9c4de; }

    /* Editor & Preview Panes (.pn) */
    .pn {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px;
      min-width: 0;
      min-height: 0;
    }

    .pn + .pn {
      border-left: 1px solid var(--cl);
    }

    .ph {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      color: #9c95b8;
      font: 600 12.5px var(--sans);
      min-height: 28px;
    }

    /* File Tabs inside Editor Header */
    .ftabs {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      flex: 1;
      padding-bottom: 2px;
    }

    .ftab {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, .05);
      border: 1px solid transparent;
      color: #9c95b8;
      font: 600 12.5px var(--mono);
      cursor: pointer;
      white-space: nowrap;
      transition: all .15s;
    }

    .ftab:hover {
      background: rgba(255, 255, 255, .1);
      color: #fff;
    }

    .ftab.on {
      background: var(--code);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 2px 10px rgba(138, 99, 232, .25);
    }

    .ftab .dot {
      color: var(--peach);
      font-size: 10px;
    }

    .ftab .x {
      font-size: 14px;
      line-height: 1;
      color: #8e85b0;
      padding: 0 3px;
      border-radius: 4px;
    }

    .ftab .x:hover {
      background: rgba(255, 255, 255, .15);
      color: #fff;
    }

    /* Syntax-Highlighted Code Box (matching your .cw / .cp tokens!) */
    .cw-edit {
      flex: 1;
      display: flex;
      border-radius: 12px;
      overflow: hidden;
      background: var(--code);
      border: 1px solid var(--cl);
      position: relative;
      transition: border-color .2s;
    }

    .cw-edit:focus-within {
      border-color: var(--peach);
    }

    .lnums {
      width: 44px;
      padding: 14px 8px 14px 0;
      text-align: right;
      font: 400 14px/1.65 var(--mono);
      color: #5c5478;
      background: rgba(255, 255, 255, .02);
      border-right: 1px solid var(--cl);
      user-select: none;
      overflow: hidden;
      flex: none;
    }

    .lnums div.cur {
      color: var(--peach);
      font-weight: 700;
    }

    .estack {
      position: relative;
      flex: 1;
      overflow: hidden;
    }

    .clayer {
      position: absolute;
      inset: 0;
      margin: 0;
      padding: 14px 16px;
      font: 400 14px/1.65 var(--mono);
      letter-spacing: 0;
      tab-size: 2;
      white-space: pre;
      overflow: auto;
      border: 0;
      outline: 0;
    }

    pre#hl {
      pointer-events: none;
      color: var(--ct);
      z-index: 1;
    }

    textarea#ci {
      background: transparent;
      color: transparent;
      caret-color: var(--peach);
      resize: none;
      z-index: 2;
    }

    textarea#ci::selection {
      background: rgba(138, 99, 232, .38);
    }

    /* Your exact theme syntax colors + CSS/JS complements */
    .tk-tag  { color: #f2a272; }
    .tk-punc { color: #8e85b0; }
    .tk-attr { color: #b79cff; }
    .tk-str  { color: #a9dc76; }
    .tk-kw   { color: #ff85b3; font-weight: 600; }
    .tk-fn   { color: #78dce8; }
    .tk-doc  { color: #8e85b0; font-style: italic; }

    /* Preview Frame & Desktop/Mobile Switcher (.fw, .vb, #lo.mob) */
    .vb {
      background: rgba(255, 255, 255, .07);
      border: 1px solid var(--cl);
      color: #c4c0d8;
      font: 600 12px var(--sans);
      padding: 3px 9px;
      border-radius: 6px;
      margin-left: 4px;
    }

    .vb.on {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .url-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }

    .url-pill {
      background: var(--code);
      border: 1px solid var(--cl);
      color: var(--ct);
      font: 12px var(--mono);
      padding: 3px 10px;
      border-radius: 7px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 220px;
    }

    .fw {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: stretch;
      background: #1a1624;
      border-radius: 12px;
      border: 1px solid var(--cl);
      overflow: hidden;
      padding: 0;
      transition: padding .2s;
    }

    .fw.mobile-mode {
      padding: 10px;
    }

    #lo {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
      transition: width .25s ease;
    }

    #lo.mob {
      width: 375px;
      max-width: 100%;
      border: 6px solid #332f4a;
      border-top-width: 22px;
      border-radius: 16px;
    }

    .hide {
      display: none !important;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--cl); border-radius: 99px; }

    @media (max-width: 820px) {
      header { padding: 8px; }
      .nb { height: 54px; }
      .play { margin: 0 8px 8px; }
      .ws { flex-direction: column; }
      .fd { width: 100%; max-height: 120px; border-right: 0; border-bottom: 1px solid var(--cl); }
      .pn + .pn { border-left: 0; border-top: 1px solid var(--cl); }
      textarea#ci, pre#hl, .lnums { font-size: 15px; }
    }

    @media (max-width: 520px) {
      .wm { display: none; }
    }
  </style>
</head>
<body>

  <!-- Matching Glassmorphic Navbar (.nb) -->
  <header>
    <div class="nb">
      <div class="l">
        <a href="index.html" class="logo" title="Back to Lessons">
          <div class="lb">&lt;/&gt;</div>
          <span class="wm">Code<i>Play</i></span>
        </a>
      </div>
      <div class="r">
        <span class="sv" id="saveBadge">Saved ✓</span>
        <button class="ib" id="themeBtn" title="Toggle Light / Dark Theme">🌓</button>
      </div>
    </div>
  </header>

  <!-- Main Playground Card (.play) -->
  <div class="play">
    <!-- Top Studio Toolbar (.mt) -->
    <div class="mt">
      <div class="l" style="flex-wrap:wrap;gap:7px">
        <button class="btn ac" id="openFolderBtn">📁 Open Folder</button>
        <button class="btn g" id="openFileBtn">📄 Open File(s)</button>
        <button class="btn g" id="newBtn">➕ New Page</button>
        <button class="btn" id="saveBtn">💾 Save</button>
      </div>
      <div class="r" style="gap:7px">
        <button class="btn g" id="toggleFolderBtn" title="Show/Hide Project Files">◧ Files</button>
        <button class="btn g" id="runBtn">▶ Run</button>
      </div>
    </div>

    <!-- 3-Pane Workspace (.ws) -->
    <div class="ws">
      <!-- Left Project Folder Explorer -->
      <aside class="fd" id="folderDrawer">
        <div class="fd-h">
          <span id="folderTitle">Project Files</span>
        </div>
        <div class="fd-list" id="fileTree"></div>
      </aside>

      <!-- Center Code Editor Pane (.pn) -->
      <div class="pn">
        <div class="ph">
          <div class="ftabs" id="tabBar"></div>
          <span id="cursorPos" style="font-family:var(--mono);font-size:11.5px;flex:none;">Ln 1, Col 1</span>
        </div>
        <div class="cw-edit">
          <div class="lnums" id="lineNums"><div>1</div></div>
          <div class="estack">
            <pre id="hl" class="clayer" aria-hidden="true"></pre>
            <textarea
              id="ci"
              class="clayer"
              spellcheck="false"
              autocapitalize="off"
              autocomplete="off"
              autocorrect="off"
              placeholder="Write HTML, CSS, or JS here..."
            ></textarea>
          </div>
        </div>
      </div>

      <!-- Right Live Preview Pane (.pn) -->
      <div class="pn">
        <div class="ph">
          <div class="url-bar">
            <button class="vb" id="backBtn" disabled title="Previous Page">←</button>
            <button class="vb" id="homeBtn" title="Home (index.html)">🏠</button>
            <span class="url-pill" id="previewUrl">index.html</span>
          </div>
          <div style="flex:none">
            <button class="vb on" id="deskBtn">Desktop</button>
            <button class="vb" id="mobBtn">Mobile</button>
          </div>
        </div>
        <div class="fw" id="frameWrap">
          <iframe id="lo" sandbox="allow-scripts allow-modals"></iframe>
        </div>
      </div>
    </div>
  </div>

  <!-- Fallbacks for Safari / Firefox / Mobile -->
  <input type="file" id="fallbackFiles" multiple class="hide" />
  <input type="file" id="fallbackFolder" webkitdirectory directory multiple class="hide" />

  <script>
    // DOM References
    const themeBtn = document.getElementById('themeBtn');
    const openFolderBtn = document.getElementById('openFolderBtn');
    const openFileBtn = document.getElementById('openFileBtn');
    const newBtn = document.getElementById('newBtn');
    const saveBtn = document.getElementById('saveBtn');
    const toggleFolderBtn = document.getElementById('toggleFolderBtn');
    const runBtn = document.getElementById('runBtn');
    const saveBadge = document.getElementById('saveBadge');

    const folderDrawer = document.getElementById('folderDrawer');
    const folderTitle = document.getElementById('folderTitle');
    const fileTree = document.getElementById('fileTree');
    const tabBar = document.getElementById('tabBar');
    const lineNums = document.getElementById('lineNums');
    const hl = document.getElementById('hl');
    const ci = document.getElementById('ci');
    const cursorPos = document.getElementById('cursorPos');

    const backBtn = document.getElementById('backBtn');
    const homeBtn = document.getElementById('homeBtn');
    const previewUrl = document.getElementById('previewUrl');
    const deskBtn = document.getElementById('deskBtn');
    const mobBtn = document.getElementById('mobBtn');
    const frameWrap = document.getElementById('frameWrap');
    const lo = document.getElementById('lo');

    const fallbackFiles = document.getElementById('fallbackFiles');
    const fallbackFolder = document.getElementById('fallbackFolder');

    // State
    let projectFiles = [];
    let openTabIds = [];
    let activeId = null;
    let previewFileId = null;
    let previewHistory = [];
    let rootFolderHandle = null;
    let nextId = 1;
    let typingTimer = null;

    const ignoredDirs = new Set(['node_modules', '.git', '.vscode', '__pycache__']);
    const allowedExt = /\.(html?|css|js|jsx|ts|tsx|json|md|txt|py|java|c|cpp|php|sql|svg)$/i;

    /* ============================================================
       THEME & VIEWPORT TOGGLES
       ============================================================ */
    themeBtn.addEventListener('click', () => {
      const root = document.documentElement;
      const isDark = root.getAttribute('data-theme') === 'dark' ||
        (!root.hasAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
      root.setAttribute('data-theme', isDark ? 'light' : 'dark');
    });

    deskBtn.addEventListener('click', () => {
      lo.classList.remove('mob');
      frameWrap.classList.remove('mobile-mode');
      deskBtn.classList.add('on');
      mobBtn.classList.remove('on');
    });

    mobBtn.addEventListener('click', () => {
      lo.classList.add('mob');
      frameWrap.classList.add('mobile-mode');
      mobBtn.classList.add('on');
      deskBtn.classList.remove('on');
    });

    toggleFolderBtn.addEventListener('click', () => {
      folderDrawer.classList.toggle('hide');
    });

    function flashSaved(text = 'Saved ✓') {
      saveBadge.textContent = text;
      saveBadge.classList.add('v');
      clearTimeout(saveBadge._t);
      saveBadge._t = setTimeout(() => saveBadge.classList.remove('v'), 2000);
    }

    /* ============================================================
       SYNTAX HIGHLIGHTING (Matching .tk-tag, .tk-attr, .tk-str, .tk-doc)
       ============================================================ */
    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function highlightSyntax(code, filename) {
      const ext = filename.split('.').pop().toLowerCase();
      let out = escapeHtml(code);

      if (ext === 'html' || ext === 'htm' || ext === 'svg') {
        out = out.replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span class="tk-doc">$1</span>');
        out = out.replace(/(&lt;\/?)([a-zA-Z0-9-]+)([\s\S]*?)(\/?&gt;)/g, (_, open, tag, attrs, close) => {
          const coloredAttrs = attrs.replace(
            /\s([a-zA-Z0-9-]+)(=)("[^"]*"|'[^']*')/g,
            ' <span class="tk-attr">$1</span><span class="tk-punc">$2</span><span class="tk-str">$3</span>'
          );
          return `<span class="tk-punc">${open}</span><span class="tk-tag">${tag}</span>${coloredAttrs}<span class="tk-punc">${close}</span>`;
        });
      } else if (ext === 'css') {
        out = out.replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="tk-doc">$1</span>');
        out = out.replace(/([a-zA-Z-]+)(\s*:\s*)([^;{}]+)(;?)/g,
          '<span class="tk-attr">$1</span><span class="tk-punc">$2</span><span class="tk-str">$3</span><span class="tk-punc">$4</span>');
        out = out.replace(/^([^{}\n]+)(\{)/gm, '<span class="tk-tag">$1</span><span class="tk-punc">$2</span>');
      } else if (ext === 'js' || ext === 'ts') {
        out = out.replace(
          /(\/\/.*$|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`)|\b(const|let|var|function|return|if|else|for|while|switch|case|break|new|class|import|export|from|async|await|try|catch|true|false|null|undefined)\b|\b(\d+(?:\.\d+)?)\b|\b([a-zA-Z_$][\w$]*)(?=\s*\()/gm,
          (m, cmt, str, kw, num, fn) => {
            if (cmt) return `<span class="tk-doc">${cmt}</span>`;
            if (str) return `<span class="tk-str">${str}</span>`;
            if (kw)  return `<span class="tk-kw">${kw}</span>`;
            if (num) return `<span class="tk-tag">${num}</span>`;
            if (fn)  return `<span class="tk-fn">${fn}</span>`;
            return m;
          }
        );
      }

      if (out.endsWith('\n')) out += ' ';
      return out;
    }

    function syncEditorUI() {
      const file = getActiveFile();
      const code = ci.value;
      hl.innerHTML = highlightSyntax(code, file ? file.name : 'index.html');

      const before = code.substring(0, ci.selectionStart);
      const line = before.split('\n').length;
      const col = before.length - before.lastIndexOf('\n');
      cursorPos.textContent = `Ln ${line}, Col ${col}`;

      const total = code.split('\n').length;
      let html = '';
      for (let i = 1; i <= total; i++) {
        html += `<div class="${i === line ? 'cur' : ''}">${i}</div>`;
      }
      lineNums.innerHTML = html;
    }

    ci.addEventListener('scroll', () => {
      hl.scrollTop = ci.scrollTop;
      hl.scrollLeft = ci.scrollLeft;
      lineNums.scrollTop = ci.scrollTop;
    });

    ci.addEventListener('click', syncEditorUI);
    ci.addEventListener('keyup', syncEditorUI);

    // Smart Tab & Enter Indentation
    ci.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const s = ci.selectionStart, end = ci.selectionEnd;
        ci.value = ci.value.substring(0, s) + '  ' + ci.value.substring(end);
        ci.selectionStart = ci.selectionEnd = s + 2;
        ci.dispatchEvent(new Event('input'));
      } else if (e.key === 'Enter') {
        const s = ci.selectionStart;
        const lineStart = ci.value.lastIndexOf('\n', s - 1) + 1;
        const indent = (ci.value.substring(lineStart, s).match(/^\s*/) || [''])[0];
        if (indent) {
          e.preventDefault();
          const end = ci.selectionEnd;
          ci.value = ci.value.substring(0, s) + '\n' + indent + ci.value.substring(end);
          ci.selectionStart = ci.selectionEnd = s + 1 + indent.length;
          ci.dispatchEvent(new Event('input'));
        }
      }
    });

    /* ============================================================
       FILE & FOLDER MANAGEMENT + MULTI-PAGE LINK NAVIGATION
       ============================================================ */
    function getFileById(id) { return projectFiles.find(f => f.id === id); }
    function getActiveFile() { return getFileById(activeId); }

    function getExtBadge(name) {
      const ext = name.split('.').pop().toLowerCase();
      if (ext === 'html' || ext === 'htm') return { text: 'HTML', cls: 'ext-html' };
      if (ext === 'css') return { text: 'CSS', cls: 'ext-css' };
      if (ext === 'js' || ext === 'ts') return { text: 'JS', cls: 'ext-js' };
      return { text: ext.slice(0, 4) || 'FILE', cls: 'ext-txt' };
    }

    function renderTree() {
      fileTree.innerHTML = '';
      if (!projectFiles.length) {
        fileTree.innerHTML = '<div style="padding:10px;font-size:12.5px;color:#8e85b0;">No files open yet.</div>';
        return;
      }

      [...projectFiles].sort((a, b) => a.path.localeCompare(b.path)).forEach(file => {
        const b = getExtBadge(file.name);
        const div = document.createElement('div');
        div.className = 'fi' + (file.id === activeId ? ' on' : '');
        div.title = file.path;
        div.innerHTML = `<span class="ext-pill ${b.cls}">${b.text}</span><span>${file.path}</span>`;
        div.onclick = () => openInTab(file.id, { syncPreview: file.name.endsWith('.html') });
        fileTree.appendChild(div);
      });
    }

    function renderTabs() {
      tabBar.innerHTML = '';
      openTabIds.forEach(id => {
        const file = getFileById(id);
        if (!file) return;

        const tab = document.createElement('div');
        tab.className = 'ftab' + (file.id === activeId ? ' on' : '');
        tab.onclick = () => switchTab(file.id, { syncPreview: file.name.endsWith('.html') });

        const label = document.createElement('span');
        label.innerHTML = `${file.name}${file.dirty ? ' <span class="dot">●</span>' : ''}`;

        const x = document.createElement('span');
        x.className = 'x';
        x.textContent = '×';
        x.onclick = (e) => { e.stopPropagation(); closeTab(file.id); };

        tab.appendChild(label);
        if (openTabIds.length > 1) tab.appendChild(x);
        tabBar.appendChild(tab);
      });
    }

    function openInTab(id, { syncPreview = false } = {}) {
      if (!openTabIds.includes(id)) openTabIds.push(id);
      switchTab(id, { syncPreview });
    }

    function switchTab(id, { syncPreview = false } = {}) {
      activeId = id;
      const file = getActiveFile();
      if (!file) return;

      ci.value = file.content;
      syncEditorUI();
      renderTree();
      renderTabs();

      if (syncPreview && file.name.endsWith('.html')) {
        navigatePreview(file.id, { recordHistory: false });
      } else if (!previewFileId) {
        updatePreview();
      }
    }

    function closeTab(id) {
      const file = getFileById(id);
      if (file && file.dirty && !confirm(`Close "${file.name}" without saving?`)) return;

      openTabIds = openTabIds.filter(tid => tid !== id);
      if (activeId === id) activeId = openTabIds[openTabIds.length - 1] || null;
      if (activeId) switchTab(activeId);
      else { ci.value = ''; syncEditorUI(); renderTree(); renderTabs(); }
    }

    // Resolve <a href="..."> relative links across project pages
    function resolveHref(currentPath, href) {
      const clean = href.split('#')[0].split('?')[0].trim();
      if (!clean) return null;
      const parts = currentPath.split('/');
      parts.pop();
      for (const seg of clean.split('/')) {
        if (!seg || seg === '.') continue;
        if (seg === '..') parts.pop();
        else parts.push(seg);
      }
      return parts.join('/');
    }

    function findLinkedFile(currentFile, href) {
      const resolved = resolveHref(currentFile.path, href);
      if (!resolved) return null;

      let match = projectFiles.find(f => f.path.toLowerCase() === resolved.toLowerCase());
      if (match) return match;

      match = projectFiles.find(f => {
        const sub = f.path.includes('/') ? f.path.split('/').slice(1).join('/') : f.path;
        return sub.toLowerCase() === resolved.toLowerCase();
      });
      if (match) return match;

      const base = resolved.split('/').pop().toLowerCase();
      return projectFiles.find(f => f.name.toLowerCase() === base) || null;
    }

    function navigatePreview(targetId, { recordHistory = true } = {}) {
      const target = getFileById(targetId);
      if (!target) return;
      if (recordHistory && previewFileId && previewFileId !== targetId) {
        previewHistory.push(previewFileId);
      }
      previewFileId = targetId;
      backBtn.disabled = previewHistory.length === 0;
      previewUrl.textContent = target.path;
      updatePreview();
    }

    function updatePreview() {
      const page = getFileById(previewFileId) || getActiveFile();
      if (!page) { lo.srcdoc = ''; return; }

      previewFileId = page.id;
      previewUrl.textContent = page.path;

      const cssBundle = projectFiles.filter(f => f.name.endsWith('.css')).map(f => f.content).join('\n');
      const jsBundle = projectFiles.filter(f => f.name.endsWith('.js')).map(f => f.content).join('\n');

      const linkHook =
        '<scr' + 'ipt>' +
        "document.addEventListener('click', function(e) {" +
        "  const a = e.target.closest('a[href]');" +
        "  if (!a) return;" +
        "  const href = a.getAttribute('href');" +
        "  if (!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:')) return;" +
        "  if (/^https?:\\/\\//i.test(href)) {" +
        "    a.setAttribute('target', '_blank');" +
        "    a.setAttribute('rel', 'noopener noreferrer');" +
        "    return;" +
        "  }" +
        "  e.preventDefault();" +
        "  window.parent.postMessage({ type: 'PLAYGROUND_LINK', href: href }, '*');" +
        "});" +
        '</scr' + 'ipt>';

      let doc = '';
      if (page.name.endsWith('.html') || page.name.endsWith('.htm')) {
        doc = page.content;
        if (cssBundle) doc += `\n<style>${cssBundle}</style>`;
        if (jsBundle) doc += `\n<script>${jsBundle}<\/script>`;
        doc += `\n${linkHook}`;
      } else if (page.name.endsWith('.css')) {
        doc = `<!DOCTYPE html><html><body><script>${page.content}<\/script>${linkHook}</body></html>`;
      } else if (page.name.endsWith('.js')) {
        doc = `<!DOCTYPE html><html><body><script>${page.content}<\/script>${linkHook}</body></html>`;
      } else {
        doc = `<pre style="padding:14px;font-family:monospace;">${escapeHtml(page.content)}</pre>${linkHook}`;
      }

      lo.srcdoc = doc;
    }

    window.addEventListener('message', (e) => {
      if (!e.data || e.data.type !== 'PLAYGROUND_LINK') return;
      const cur = getFileById(previewFileId) || getActiveFile();
      if (!cur) return;

      const target = findLinkedFile(cur, e.data.href);
      if (target) {
        navigatePreview(target.id, { recordHistory: true });
        openInTab(target.id, { syncPreview: false });
      } else {
        alert(`Page "${e.data.href}" doesn't exist yet. Click "+ New Page" to create it!`);
      }
    });

    backBtn.addEventListener('click', () => {
      const prev = previewHistory.pop();
      if (prev) navigatePreview(prev, { recordHistory: false });
    });

    homeBtn.addEventListener('click', () => {
      const idx = projectFiles.find(f => f.name.toLowerCase() === 'index.html') || projectFiles[0];
      if (idx) navigatePreview(idx.id, { recordHistory: true });
    });

    async function scanFolder(dirHandle, prefix = '') {
      for await (const entry of dirHandle.values()) {
        const rel = prefix ? `${prefix}/${entry.name}` : entry.name;
        if (entry.kind === 'directory') {
          if (!ignoredDirs.has(entry.name)) await scanFolder(entry, rel);
        } else if (entry.kind === 'file' && allowedExt.test(entry.name)) {
          const f = await entry.getFile();
          projectFiles.push({
            id: nextId++,
            name: entry.name,
            path: rel,
            content: await f.text(),
            handle: entry,
            dirty: false
          });
        }
      }
    }

    openFolderBtn.addEventListener('click', async () => {
      if ('showDirectoryPicker' in window) {
        try {
          rootFolderHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
          folderTitle.textContent = rootFolderHandle.name;
          projectFiles = [];
          openTabIds = [];
          activeId = null;
          previewFileId = null;
          previewHistory = [];

          await scanFolder(rootFolderHandle);
          renderTree();

          if (projectFiles.length) {
            const idx = projectFiles.find(f => f.name.toLowerCase() === 'index.html') || projectFiles[0];
            previewFileId = idx.id;
            openInTab(idx.id, { syncPreview: true });
          }
        } catch (err) {
          if (err.name !== 'AbortError') alert(err.message);
        }
      } else {
        fallbackFolder.click();
      }
    });

    fallbackFolder.addEventListener('change', async (e) => {
      const list = Array.from(e.target.files).filter(f => allowedExt.test(f.name));
      if (!list.length) return;

      rootFolderHandle = null;
      folderTitle.textContent = (list[0].webkitRelativePath || '').split('/')[0] || 'Folder';
      projectFiles = [];
      openTabIds = [];
      previewHistory = [];

      for (const f of list) {
        projectFiles.push({
          id: nextId++,
          name: f.name,
          path: f.webkitRelativePath || f.name,
          content: await f.text(),
          handle: null,
          dirty: false
        });
      }
      renderTree();
      if (projectFiles.length) {
        const idx = projectFiles.find(f => f.name.toLowerCase() === 'index.html') || projectFiles[0];
        previewFileId = idx.id;
        openInTab(idx.id, { syncPreview: true });
      }
      e.target.value = '';
    });

    function upsertFile(name, path, content, handle = null) {
      const existing = projectFiles.find(f => f.path === path);
      if (existing) {
        existing.content = content;
        existing.handle = handle;
        existing.dirty = false;
        openInTab(existing.id, { syncPreview: existing.name.endsWith('.html') });
      } else {
        const f = { id: nextId++, name, path, content, handle, dirty: false };
        projectFiles.push(f);
        openInTab(f.id, { syncPreview: f.name.endsWith('.html') });
      }
      renderTree();
    }

    openFileBtn.addEventListener('click', async () => {
      if ('showOpenFilePicker' in window) {
        try {
          const handles = await window.showOpenFilePicker({ multiple: true });
          for (const h of handles) {
            const f = await h.getFile();
            upsertFile(f.name, f.name, await f.text(), h);
          }
        } catch (err) {
          if (err.name !== 'AbortError') alert(err.message);
        }
      } else {
        fallbackFiles.click();
      }
    });

    fallbackFiles.addEventListener('change', async (e) => {
      for (const f of e.target.files) {
        upsertFile(f.name, f.name, await f.text(), null);
      }
      e.target.value = '';
    });

    newBtn.addEventListener('click', async () => {
      const name = prompt('New file name (e.g. about.html, style.css, script.js):', 'about.html');
      if (!name || !name.trim()) return;
      const clean = name.trim();

      let handle = null;
      let path = clean;
      if (rootFolderHandle && 'getFileHandle' in rootFolderHandle) {
        try {
          handle = await rootFolderHandle.getFileHandle(clean, { create: true });
          path = `${rootFolderHandle.name}/${clean}`;
        } catch (err) {
          alert('Could not create file in folder: ' + err.message);
        }
      }

      const starter = clean.endsWith('.html')
        ? `<!DOCTYPE html>\n<html>\n<head>\n  <title>${clean}</title>\n</head>\n<body>\n  <div class="card">\n    <h1>${clean}</h1>\n    <p>Edit this page or link back home!</p>\n    <a class="btn" href="index.html">← Back to Home</a>\n  </div>\n</body>\n</html>`
        : '';

      upsertFile(clean, path, starter, handle);
    });

    ci.addEventListener('input', () => {
      const file = getActiveFile();
      if (!file) return;
      file.content = ci.value;
      syncEditorUI();

      if (!file.dirty) {
        file.dirty = true;
        renderTabs();
      }
      clearTimeout(typingTimer);
      typingTimer = setTimeout(updatePreview, 250);
    });

    async function saveCurrentFile() {
      const file = getActiveFile();
      if (!file) return;

      if ('showSaveFilePicker' in window) {
        try {
          if (!file.handle) {
            file.handle = await window.showSaveFilePicker({ suggestedName: file.name });
            file.name = (await file.handle.getFile()).name;
          }
          const w = await file.handle.createWritable();
          await w.write(file.content);
          await w.close();
          file.dirty = false;
          renderTabs();
          flashSaved('Saved ✓');
        } catch (err) {
          if (err.name !== 'AbortError') alert(err.message);
        }
      } else {
        const blob = new Blob([file.content], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = file.name;
        a.click();
        URL.revokeObjectURL(a.href);
        file.dirty = false;
        renderTabs();
        flashSaved('Downloaded ✓');
      }
    }

    saveBtn.addEventListener('click', saveCurrentFile);
    runBtn.addEventListener('click', updatePreview);

    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
        e.preventDefault();
        saveCurrentFile();
      }
    });

    // Seed initial starter pages matching your site's lavender & peach aesthetic
    const home = {
      id: nextId++,
      name: 'index.html',
      path: 'index.html',
      content: `<!DOCTYPE html>
<html>
<head>
  <title>My Student Site</title>
</head>
<body>
  <div class="card">
    <span class="tag">My Project</span>
    <h1>Hello, World!</h1>
    <p>Edit this HTML or click the button below to jump to another page.</p>
    <a class="btn" href="about.html">Visit About Page →</a>
  </div>
</body>
</html>`,
      handle: null,
      dirty: false
    };

    const about = {
      id: nextId++,
      name: 'about.html',
      path: 'about.html',
      content: `<!DOCTYPE html>
<html>
<head>
  <title>About Page</title>
</head>
<body>
  <div class="card">
    <span class="tag">Page 2</span>
    <h1>About Me</h1>
    <p>You jumped here using an HTML hyperlink!</p>
    <a class="btn" href="index.html">← Back to Home</a>
  </div>
</body>
</html>`,
      handle: null,
      dirty: false
    };

    const css = {
      id: nextId++,
      name: 'style.css',
      path: 'style.css',
      content: `body {
  font-family: system-ui, sans-serif;
  background: #f5f2fb;
  color: #1f1b2e;
  padding: 2rem;
}

.card {
  background: #ffffff;
  border: 1px solid #e2dbf2;
  border-radius: 16px;
  padding: 24px;
  max-width: 440px;
  box-shadow: 0 12px 32px rgba(40, 20, 90, 0.08);
}

.tag {
  background: #efe9ff;
  color: #8a63e8;
  font-size: 12px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 99px;
}

.btn {
  display: inline-block;
  margin-top: 12px;
  padding: 10px 18px;
  background: #f2a272;
  color: #2a1608;
  text-decoration: none;
  border-radius: 10px;
  font-weight: 600;
}`,
      handle: null,
      dirty: false
    };

    projectFiles.push(home, about, css);
    previewFileId = home.id;
    renderTree();
    openInTab(home.id, { syncPreview: false });
    updatePreview();
  </script>
</body>
</html>
